  /* ============ 令牌 v0.3「年轮」 ============ */
  :root[data-theme="dark"] {
    --bg: #121814;            /* 腐殖土 —— 深松绿黑，非纯黑 */
    --surface: #171F1A;       /* 苔毡 —— 面板 */
    --surface-2: #1F2922;     /* 叶背 —— 抬升层：输入坞/悬浮 */
    --line: rgba(230,236,225,.09);
    --line-strong: rgba(230,236,225,.17);
    --grid: rgba(230,236,225,.045);   /* 格纸 */
    --fg: #E6EADF;            /* 骨白 */
    --muted: #99A593;
    --faint: #6B7767;
    --accent: #8FC166;        /* 叶绿 —— 行动/生命 */
    --accent-ink: #17240E;
    --moss: #6FA24E;          /* 分类：思考 */
    --lake: #79ADC2;          /* 分类：观察 */
    --plum: #B79BD1;          /* 分类：事件 */
    --resin: #D9A84E;         /* 分类：行动 / 警示（树脂） */
    --clay: #D4735E;          /* 危险 / 错误（陶土） */
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #EFF0E8;
    --surface: #FBFCF7;
    --surface-2: #E8EBE1;
    --line: rgba(29,37,31,.13);
    --line-strong: rgba(29,37,31,.22);
    --grid: rgba(29,37,31,.055);
    --fg: #20271F;
    --muted: #5B675A;
    --faint: #8C968B;
    --accent: #46853A;
    --accent-ink: #F4FAEF;
    --moss: #5F9147;
    --lake: #3E7C93;
    --plum: #7C5F9E;
    --resin: #A9791E;
    --clay: #B34E3A;
    --shadow: 0 10px 26px rgba(30,40,30,.10);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  :root {
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --note: "IBM Plex Serif", Georgia, "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
    --mono: "Google Sans Code", ui-monospace, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.65 var(--sans); -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  ::selection { background: color-mix(in oklch, var(--accent) 25%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .m { font-family: var(--mono); }
  .n { font-family: var(--note); }
  .ic { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ic.sm { width: 13px; height: 13px; }

  /* ============ 骨架：左栏 / 工作区 / 档案 ============ */
  .shell {
    display: grid; grid-template-columns: 224px minmax(0,1fr) 300px;
    height: 100vh; overflow: hidden;
  }
  .rail { background: var(--bg); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .rail .brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 16px; font-family: var(--mono); font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
  .brand .leafmark { width: 9px; height: 9px; border-radius: 2px 8px 2px 8px; background: var(--accent); }
  .r-item, .r-sec {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 6.5px 9px; border-radius: 8px; color: var(--muted); font-size: 13px;
  }
  .r-item:hover, .r-sec:hover { background: var(--surface-2); color: var(--fg); }
  .r-item.on { background: color-mix(in oklch, var(--accent) 13%, transparent); color: var(--fg); }
  .r-item.on::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); margin-right: -2px; }
  .r-sec.active { background: color-mix(in oklch, var(--accent) 13%, transparent); color: var(--fg); }
  .r-sec.active::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); margin-right: -2px; }
  .r-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--faint); padding: 16px 9px 5px; }
  .r-grow { flex: 1; }
  .r-foot { border-top: 1px solid var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 1px; }
  .r-mini { display: flex; align-items: center; gap: 8px; padding: 5.5px 9px; border-radius: 8px; color: var(--muted); font-size: 12.5px; }
  .r-mini:hover { background: var(--surface-2); color: var(--fg); }
  .r-mini .m { font-size: 11px; }
  .who { display: flex; align-items: center; gap: 8px; padding: 10px 9px 2px; color: var(--muted); font-size: 12.5px; }
  .who .ava { width: 22px; height: 22px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; color: var(--fg); font-family: var(--mono); font-size: 11px; }
  .livedot { width: 6px; height: 6px; border-radius: 99px; background: var(--faint); flex: none; }
  .livedot.on { background: var(--accent); box-shadow: 0 0 0 0 color-mix(in oklch, var(--accent) 55%, transparent); animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--accent) 50%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  .workspace { display: flex; min-width: 0; padding: 9px; gap: 9px; }
  .card {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: 13px; overflow: hidden;
  }
  .dossier {
    width: 300px; flex: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: 13px; overflow-y: auto; padding: 14px 12px 18px;
  }

  /* ============ 身份名册头（masthead） ============ */
  .mast { padding: 14px 20px 0; }
  .mast-top { display: flex; align-items: center; gap: 10px; }
  .mast .name { font-family: var(--note); font-size: 19px; font-weight: 600; letter-spacing: .01em; }
  .chip-live {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; color: var(--fg);
    background: color-mix(in oklch, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in oklch, var(--accent) 28%, transparent);
    padding: 2px 9px; border-radius: 999px;
  }
  .chip-live .dot { width: 5px; height: 5px; border-radius: 99px; background: var(--accent); animation: pulse 2.4s ease-out infinite; }
  .mast .acts { margin-left: auto; display: flex; gap: 4px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 8px;
    border: 1px solid var(--line-strong); color: var(--fg); font-size: 12.5px;
    white-space: nowrap; flex-shrink: 0;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--fg); }
  .btn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .btn.solid:hover { filter: brightness(1.06); }
  .btn.danger { color: var(--clay); border-color: transparent; }
  .btn.danger:hover { background: color-mix(in oklch, var(--clay) 12%, transparent); }
  .btn:disabled { opacity: .45; }

  /* ============ 生命线（签名元素） ============ */
  .vital { padding: 10px 20px 0; }
  .vital-track {
    position: relative; height: 34px; border-radius: 6px;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 100% 17px, 26px 100%;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .vbars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 1px; padding: 0 2px; }
  .vb { flex: 1; min-width: 0; background: var(--moss); border-radius: 1px 1px 0 0; opacity: .85; }
  .vb.dim { opacity: .35; }
  .vital-track .now-edge { position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: var(--accent); animation: nowpulse 2s ease-in-out infinite; }
  @keyframes nowpulse { 50% { opacity: .35; } }
  .vm { position: absolute; transform: translateX(-50%); }
  .vm.err { bottom: 2px; width: 7px; height: 3px; border-radius: 1px; background: var(--clay); }
  .vm.msg { top: 2px; width: 5px; height: 5px; border-radius: 99px; transform: translateX(-50%) rotate(45deg); background: var(--lake); }
  .vital-meta { display: flex; justify-content: space-between; padding-top: 4px; font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .vital-tip {
    position: fixed; z-index: 60; pointer-events: none; display: none;
    background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 7px;
    padding: 5px 9px; font-family: var(--mono); font-size: 11px; color: var(--fg); box-shadow: var(--shadow);
  }

  /* ============ tab 条 ============ */
  .tabsrow { display: flex; align-items: center; gap: 2px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); margin-top: 12px; }
  .tab { position: relative; padding: 7px 12px 10px; color: var(--muted); font-size: 13px; }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); }
  .tab.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }
  .tabsrow .sp { flex: 1; }
  .seg { display: flex; gap: 2px; background: var(--surface-2); padding: 2px; border-radius: 8px; }
  .seg button { padding: 3.5px 10px; border-radius: 6px; font-size: 12px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .search {
    display: flex; align-items: center; gap: 7px; padding: 5px 10px; min-width: 190px;
    border: 1px solid var(--line); border-radius: 8px; color: var(--faint); font-size: 12.5px; margin: 0 0 7px 10px;
  }

  /* ============ 画布：格纸 + 泳道 ============ */
  .canvas { flex: 1; overflow: auto; position: relative; }
  .canvas.gridpaper {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .lane-head { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 62px repeat(4, 1fr); background: color-mix(in oklch, var(--surface) 92%, transparent); backdrop-filter: blur(4px); border-bottom: 1px solid var(--line); }
  .lane-head .lh { padding: 7px 10px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: color-mix(in oklch, var(--fg) 76%, transparent); display: flex; align-items: center; gap: 6px; }
  .lane-head .lh:first-child { color: var(--faint); }
  .lane-head .lh .td { width: 6px; height: 6px; border-radius: 99px; }
  .runs { position: relative; }
  .run { border-bottom: 1px dashed var(--line); }
  .run:last-child { border-bottom: 0; }
  .run-sep { display: flex; justify-content: flex-end; padding: 4px 12px 0; }
  .run-sep .dur { font-family: var(--mono); font-size: 10px; color: var(--faint); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; background: var(--surface); }
  .row { display: grid; grid-template-columns: 62px repeat(4, 1fr); min-height: 34px; }
  .row .t { padding: 8px 10px 0; font-family: var(--mono); font-size: 10.5px; color: var(--faint); text-align: right; }
  .lane { border-left: 1px solid var(--line); padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .step {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    font-family: var(--mono); font-size: 11.5px; color: var(--fg);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .step .td { width: 6px; height: 6px; border-radius: 99px; flex: none; }
  .step.thought { background: color-mix(in oklch, var(--moss) 10%, var(--surface)); border-color: color-mix(in oklch, var(--moss) 25%, transparent); }
  .step.obs { background: color-mix(in oklch, var(--lake) 10%, var(--surface)); border-color: color-mix(in oklch, var(--lake) 25%, transparent); }
  .step.act { background: color-mix(in oklch, var(--resin) 10%, var(--surface)); border-color: color-mix(in oklch, var(--resin) 28%, transparent); }
  .step.err { background: color-mix(in oklch, var(--clay) 12%, var(--surface)); border-color: color-mix(in oklch, var(--clay) 30%, transparent); }
  .step.msg { background: color-mix(in oklch, var(--lake) 8%, var(--surface)); border-color: color-mix(in oklch, var(--lake) 22%, transparent); }
  .step .who { color: var(--faint); padding: 0; font-size: 11px; }
  .gap-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px 2px 62px; color: var(--faint); font-family: var(--mono); font-size: 10.5px; }
  .gap-row::before { content: ""; height: 1px; flex: 1; background: repeating-linear-gradient(90deg, var(--line-strong) 0 4px, transparent 4px 8px); }
  .gap-row::after { content: ""; height: 1px; flex: 1; background: repeating-linear-gradient(90deg, var(--line-strong) 0 4px, transparent 4px 8px); }

  /* ============ 档案（右栏） ============ */
  .d-card { background: var(--surface-2); border-radius: 11px; padding: 11px 12px; margin-bottom: 12px; }
  .d-card .head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
  .d-card .name { font-family: var(--note); font-size: 14px; font-weight: 600; }
  .d-card .when { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .d-card .sum { font-family: var(--note); font-size: 12.5px; line-height: 1.7; color: var(--muted); }
  .d-sec { padding: 4px 0 6px; }
  .d-sec > .sh { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--faint); padding: 6px 6px 4px; display: flex; align-items: center; gap: 6px; }
  .d-sec > .sh .sp { flex: 1; }
  .d-row { display: flex; align-items: center; gap: 8px; padding: 5.5px 6px; border-radius: 7px; font-size: 12.5px; color: var(--muted); }
  .d-row:hover { background: var(--surface-2); color: var(--fg); }
  .d-row .k { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d-row .v { font-family: var(--mono); font-size: 11.5px; color: var(--fg); }
  .d-row .v.dim { color: var(--muted); }
  .st { width: 7px; height: 7px; border-radius: 99px; flex: none; }
  .st.run { background: var(--accent); animation: pulse 2.4s ease-out infinite; }
  .st.idle { background: var(--faint); }
  .st.off { background: transparent; border: 1.5px solid var(--faint); }
  .budget { padding: 2px 6px 6px; }
  .budget .bar { height: 4px; border-radius: 99px; background: var(--surface); overflow: hidden; }
  .budget .bar i { display: block; height: 100%; width: 34%; background: var(--accent); }
  .budget .meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--faint); padding-top: 4px; }
  .filechips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 6px 4px; }
  .filechip { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 2.5px 8px; }

  /* ============ 状态坞 ============ */
  .dock {
    height: 30px; flex: none; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px; padding: 0 14px;
    font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  }
  .dock .sp { flex: 1; }
  .dock .up { color: var(--muted); }

  /* ============ 对话 ============ */
  .thread { flex: 1; overflow: auto; }
  .thread-inner { max-width: 720px; margin: 0 auto; padding: 22px 26px 10px; }
  .msg { margin-bottom: 20px; }
  .msg .meta { display: flex; align-items: baseline; gap: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-bottom: 5px; }
  .msg .meta .src { color: var(--muted); }
  .msg .body { font-size: 14px; }
  .msg.mind .body {
    font-family: var(--note); font-size: 14.5px; line-height: 1.8; color: var(--fg);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px;
  }
  .msg.mind .body .k { font-family: var(--mono); font-size: 12px; background: color-mix(in oklch, var(--fg) 7%, transparent); border-radius: 5px; padding: 1px 6px; }
  .msg.op .body { color: var(--muted); padding-left: 14px; border-left: 2px solid var(--line-strong); }
  .working { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 10px; padding: 8px 13px; margin-bottom: 18px; }
  .working .dots { display: inline-flex; gap: 3px; }
  .working .dots i { width: 4px; height: 4px; border-radius: 99px; background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
  .working .dots i:nth-child(2) { animation-delay: .15s; }
  .working .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .composer { flex: none; padding: 0 26px 14px; }
  .composer-box { max-width: 720px; margin: 0 auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px 9px; box-shadow: var(--shadow); }
  .composer-box .ph { color: var(--faint); padding: 1px 3px 16px; }
  .composer-row { display: flex; align-items: center; gap: 3px; }
  .composer-row .sp { flex: 1; }
  .c-mini { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 4px 9px; border-radius: 7px; }
  .c-mini:hover { background: var(--surface); color: var(--fg); }
  .c-mini.warn { color: var(--resin); }
  .send { width: 29px; height: 29px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .send:hover { filter: brightness(1.07); }

  /* ============ 读数（用量/账页） ============ */
  .page { flex: 1; overflow: auto; }
  .page-inner { max-width: 880px; margin: 0 auto; padding: 22px 26px 30px; }
  .page-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .page-title h1 { font-family: var(--note); font-size: 22px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .page-title .sub { color: var(--muted); font-size: 13px; }
  .readout { display: flex; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; margin: 18px 0; }
  .ro { flex: 1; padding: 11px 16px 12px; border-right: 1px solid var(--line); }
  .ro:last-child { border-right: 0; }
  .ro .l { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--faint); margin-bottom: 4px; }
  .ro .v { font-family: var(--mono); font-size: 21px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .ro .v small { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 3px; }
  .chart-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 16px 18px 12px; margin-bottom: 16px; position: relative; }
  .chart-card .ct { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
  .chart-card .ct h2 { font-size: 14.5px; font-weight: 600; margin: 0; }
  .chart-card .ct .note { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .legend { display: flex; gap: 14px; margin: 8px 0 6px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .bars { position: relative; height: 170px; border-bottom: 1px solid var(--line-strong); background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 34px; display: flex; align-items: flex-end; gap: 10px; padding: 0 6px; }
  .bcol { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; position: relative; }
  .bcol:hover { background: color-mix(in oklch, var(--fg) 4%, transparent); }
  .bcol .seg-in { background: var(--moss); border-radius: 3px 3px 0 0; opacity: .9; }
  .bcol .seg-out { background: var(--lake); opacity: .85; }
  .bcol .seg-th { background: var(--plum); opacity: .8; }
  .bcol .seg-in:last-child, .bcol .seg-out:last-child { border-radius: 3px 3px 0 0; }
  .xlabels { display: flex; gap: 10px; padding: 6px 6px 0; font-family: var(--mono); font-size: 9.5px; color: var(--faint); }
  .xlabels span { flex: 1; text-align: center; }
  .ann { position: absolute; font-family: var(--note); font-style: italic; font-size: 12px; color: var(--muted); }
  .ann::before { content: ""; position: absolute; left: -14px; top: 9px; width: 10px; height: 1px; background: var(--faint); }
  .ledger { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; margin-bottom: 16px; }
  .ledger .lh { display: grid; grid-template-columns: 1fr auto auto; gap: 18px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--faint); }
  .ledger .lr { display: grid; grid-template-columns: 1fr auto auto; gap: 18px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .ledger .lr:last-child { border-bottom: 0; }
  .ledger .lr:hover { background: var(--surface-2); }
  .ledger .lr .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .meter { height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .hint { color: var(--faint); font-size: 12px; line-height: 1.7; }

  /* ============ 首页：名册 ============ */
  .rows { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .rhead { display: grid; grid-template-columns: minmax(140px,1.1fr) 84px 92px 76px minmax(150px,1.5fr) 52px 124px; gap: 8px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--faint); }
  .irow { display: grid; grid-template-columns: minmax(140px,1.1fr) 84px 92px 76px minmax(150px,1.5fr) 52px 124px; gap: 8px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .irow:last-child { border-bottom: 0; }
  .irow:hover { background: var(--surface-2); }
  .irow .id { display: flex; align-items: center; gap: 10px; }
  .irow .nm { font-size: 13.5px; font-weight: 500; }
  .irow .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10.5px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line-strong); color: var(--muted); }
  .pill.on { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 35%, transparent); background: color-mix(in oklch, var(--accent) 10%, transparent); }
  .spark { height: 26px; display: flex; align-items: flex-end; gap: 2px; opacity: .9; }
  .spark i { flex: 1; border-radius: 1px 1px 0 0; background: var(--moss); }
  .spark i.g { background: transparent; }
  .spark i.e { background: var(--clay); }
  .ghost-ava { width: 26px; height: 26px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* ============ 工作台：需要你 + 心智卡 ============ */
  .attn { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; margin-bottom: 14px; }
  .attn-h { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--faint); }
  .attn-h .td { width: 6px; height: 6px; border-radius: 99px; }
  .attn-h .cnt { color: var(--resin); font-weight: 600; font-size: 11.5px; }
  .attn-h .sp { flex: 1; }
  .attn-row { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .attn-row:last-child { border-bottom: 0; }
  .attn-row:hover { background: var(--surface-2); }
  .attn-row .k { font-size: 13px; font-weight: 500; }
  .attn-row .d { font-size: 12.5px; color: var(--muted); }
  .attn-row .go { font-family: var(--mono); font-size: 10.5px; color: var(--resin); }
  .idcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .idcard { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 13px 14px 11px; display: flex; flex-direction: column; gap: 8px; }
  .ic-head { display: flex; align-items: center; gap: 9px; }
  .ic-head .nm { font-size: 14px; font-weight: 500; }
  .ic-sub { font-size: 12px; color: var(--muted); margin-top: -3px; }
  .spark.big { height: 34px; gap: 3px; }
  .spark.big i { border-radius: 2px 2px 0 0; }
  .ic-cap { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--faint); margin-top: -4px; }
  .ic-map { display: grid; grid-template-columns: 1fr auto; row-gap: 5px; column-gap: 8px; border-top: 1px dashed var(--line); padding-top: 9px; }
  .ic-map .k { font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .05em; }
  .ic-map .v { font-family: var(--mono); font-size: 11.5px; text-align: right; }
  .ic-acts { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  .ic-acts .sp { flex: 1; }
  .ic-acts .btn { padding: 5px 9px; font-size: 12px; }

  /* ============ 日志流（轨迹·日志流视图） ============ */
  .lsbar { display: flex; align-items: center; gap: 10px; padding: 10px 20px 2px; flex-wrap: wrap; }
  .lsbar .sp { flex: 1; }
  .fchips { display: flex; gap: 6px; align-items: center; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; padding: 2.5px 9px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); }
  .fchip .td { width: 5px; height: 5px; border-radius: 99px; }
  .fchip.on { color: var(--fg); border-color: color-mix(in oklch, var(--accent) 40%, transparent); background: color-mix(in oklch, var(--accent) 9%, transparent); }
  .ls { flex: 1; overflow: auto; }
  .ls-inner { max-width: 800px; margin: 0 auto; padding: 12px 20px 28px; }
  .lsb { display: flex; align-items: center; gap: 10px; padding: 10px 0 4px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

  .lcb { border-left: 2px solid var(--moss); border-radius: 0 10px 10px 0; padding: 8px 13px 9px; background: color-mix(in oklch, var(--moss) 7%, transparent); }
  .lcb.obs { border-color: var(--lake); background: color-mix(in oklch, var(--lake) 7%, transparent); }
  .lcb.act { border-color: var(--resin); background: color-mix(in oklch, var(--resin) 7%, transparent); }
  .lcb.msg { border-color: var(--plum); background: color-mix(in oklch, var(--plum) 7%, transparent); }
  .lcb.err { border-color: var(--clay); background: color-mix(in oklch, var(--clay) 8%, transparent); }
  .lcb.final { border-color: var(--fg); background: var(--surface-2); }

  .lcb .bd .k { font-family: var(--mono); font-size: 11.5px; background: color-mix(in oklch, var(--fg) 7%, transparent); border-radius: 5px; padding: 1px 5px; }
  .lcb .bd.n { font-family: var(--note); font-size: 13.5px; line-height: 1.75; }
  .tool { margin-top: 7px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); overflow: hidden; }
  .tool .th { display: flex; align-items: center; gap: 8px; padding: 7px 11px; font-family: var(--mono); font-size: 11px; color: var(--fg); }
  .tool .th .chev { color: var(--faint); }
  .tool .th .sp { flex: 1; }
  .tool .tbd { border-top: 1px dashed var(--line); background: var(--surface-2); padding: 7px 11px 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.6; }
  .tool .tbd.bad { color: var(--clay); }

  /* ============ 分集（轨迹·分集视图） ============ */
  .sec-label { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--faint); margin: 20px 0 8px; }
  .recard { border: 1px solid var(--line); border-radius: 11px; background: var(--surface); padding: 12px 15px; margin-bottom: 9px; }
  .recard .rt { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; font-weight: 500; margin-bottom: 3px; }
  .recard .rt .m { font-family: var(--mono); font-size: 10.5px; color: var(--faint); font-weight: 400; }
  .recard .rd { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin-bottom: 7px; }
  .recard .arc { font-family: var(--note); font-size: 14px; line-height: 1.85; }
  .sref-row { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .sref { display: inline-flex; align-items: baseline; gap: 6px; font-size: 11px; color: var(--muted); }
  .sref b { font-family: var(--mono); font-weight: 500; font-size: 10.5px; color: var(--plum); background: color-mix(in oklch, var(--plum) 10%, transparent); border-radius: 5px; padding: 1px 6px; }

  /* ============ 记忆（两栏） ============ */
  .mem { flex: 1; display: grid; grid-template-columns: 288px 1fr; min-height: 0; }
  .mem-list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .mem-list-h { padding: 12px 14px 9px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
  .minput { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--faint); font-size: 12.5px; }
  .mtype { display: flex; flex-wrap: wrap; gap: 5px; }
  .mitems { overflow: auto; min-height: 0; }

  .mitem.old { opacity: .5; }
  .mitem .mo { display: flex; align-items: center; gap: 6px; }
  .mitem .sm2 { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mitem .sl { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .mitem .num { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .mbadge { font-family: var(--mono); font-size: 9.5px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 7px; }
  .mstat { font-family: var(--mono); font-size: 9.5px; color: var(--clay); border: 1px solid color-mix(in oklch, var(--clay) 35%, transparent); border-radius: 999px; padding: 1px 7px; }
  .mem-det { overflow: auto; min-height: 0; padding: 18px 24px 30px; }
  .mdet-h { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .mdet-h .sp { flex: 1; }
  .mem-det h2 { font-family: var(--note); font-size: 19px; font-weight: 600; margin: 14px 0 10px; }
  .mem-body { font-family: var(--note); font-size: 14px; line-height: 1.85; max-width: 640px; }
  .mem-body p { margin: 0 0 11px; }

  /* ============ 思考者 / 日程 ============ */
  .sbar { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 11px 16px; margin: 16px 0 14px; }
  .sbar .sp { flex: 1; }
  .tkhead { display: grid; grid-template-columns: minmax(140px,1.3fr) 118px 110px 106px 100px auto; gap: 8px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--faint); }
  .tkrow { display: grid; grid-template-columns: minmax(140px,1.3fr) 118px 110px 106px 100px auto; gap: 8px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .tkrow:last-child { border-bottom: 0; }
  .tkrow:hover { background: var(--surface-2); }
  .tkrow .nm { font-family: var(--mono); font-size: 13px; }
  .tkrow .vs { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .tacts { display: flex; gap: 5px; justify-content: flex-end; }
  .pill.warn { color: var(--resin); border-color: color-mix(in oklch, var(--resin) 40%, transparent); background: color-mix(in oklch, var(--resin) 8%, transparent); }
  .serow { display: grid; grid-template-columns: 22px 178px 1fr 128px auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .serow:last-child { border-bottom: 0; }
  .serow:hover { background: var(--surface-2); }
  .serow .nm { font-family: var(--mono); font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .serow .sm3 { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .serow .sm3 .m { font-size: 11px; color: var(--fg); }
  .serow .ms3 { font-family: var(--mono); font-size: 10.5px; color: var(--faint); line-height: 1.7; }
  .serow.off .nm, .serow.off .sm3, .serow.off .ms3 { opacity: .5; }
  .cbox { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: transparent; flex: none; }
  .cbox.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ============ 健康 ============ */
  .ledger.h4 .lh, .ledger.h4 .lr { grid-template-columns: 90px 1fr 170px 100px; }
  .chip-ok { font-family: var(--mono); font-size: 10.5px; color: var(--accent); border: 1px solid color-mix(in oklch, var(--accent) 35%, transparent); border-radius: 999px; padding: 1px 8px; }
  .chip-no { font-family: var(--mono); font-size: 10.5px; color: var(--clay); border: 1px solid color-mix(in oklch, var(--clay) 35%, transparent); border-radius: 999px; padding: 1px 8px; }

  /* ============ 设置（配置/技能/连接） ============ */
  .page-inner.wide { max-width: 1040px; }
  .setting { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px 16px 10px; margin-bottom: 14px; }
  .setting h2 { font-size: 14.5px; font-weight: 600; margin: 0 0 3px; }
  .setting .desc { color: var(--faint); font-size: 12px; line-height: 1.65; margin-bottom: 8px; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--line); }
  .prow .nm { font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .prow .meta2 { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .prow .sp { flex: 1; }
  .slot { display: grid; grid-template-columns: 200px 1fr auto; gap: 10px; align-items: center; padding: 10px 2px; border-top: 1px solid var(--line); }
  .slot .sl2 { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .sel2 { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; background: var(--surface-2); justify-self: start; }
  .mono-k { font-family: var(--mono); font-size: 11.5px; color: var(--fg); }
  .frow { display: flex; align-items: center; gap: 9px; padding: 8px 2px 10px; }
  .skrow { display: grid; grid-template-columns: minmax(170px,230px) 1fr auto; gap: 14px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .skrow:last-child { border-bottom: 0; }
  .skrow:hover { background: var(--surface-2); }
  .skrow .nm { font-family: var(--mono); font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .skrow .ds { font-size: 12.5px; color: var(--muted); }
  .skrow .dir { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .mcard { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 16px; margin-bottom: 10px; }
  .mcard .mh { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

  .mcard .ln { font-family: var(--mono); font-size: 11.5px; color: var(--muted); line-height: 1.75; }
  .lnk { font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .lnk:hover { color: var(--fg); }

  /* ============ 样张控制条（仅样张导航用，非产品设计） ============ */
  .toolbar {
    position: fixed; right: 14px; bottom: 14px; z-index: 90; display: flex; gap: 8px; align-items: center;
    background: color-mix(in oklch, var(--surface-2) 90%, transparent); border: 1.5px dashed var(--line-strong);

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

    if (s === 'home') { buildSpark('spark-ada', days14ada); buildSpark('spark-q1', days14q1); buildSpark('spark-q2', days14q2); }
    document.querySelectorAll('#areaSeg button').forEach(b => b.classList.toggle('on', b.dataset.a === area));
    const subs = SUBS[area] || [];
    const subSeg = document.getElementById('subSeg'), subDiv = document.getElementById('subDiv');
    subSeg.style.display = subs.length ? '' : 'none';
    subDiv.style.display = subs.length ? '' : 'none';
    if (subs.length) subSeg.innerHTML = subs.map(([id, label]) => '<button data-s="' + id + '"' + (id === s ? ' class="on"' : '') + '>' + label + '</button>').join('');
    document.getElementById('rail-home').classList.toggle('on', s === 'home');
    document.querySelectorAll('.rail .r-sec').forEach((b, i) => b.classList.toggle('active', s !== 'home' && i === 0));
  }
  document.getElementById('areaSeg').addEventListener('click', e => { const a = e.target.dataset.a; if (a) show(AREA_DEFAULT[a]); });
  document.getElementById('subSeg').addEventListener('click', e => { const s = e.target.dataset.s; if (s) show(s); });
  document.getElementById('themeSeg').addEventListener('click', e => {
    const t = e.target.dataset.t; if (!t) return;
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  });

  // ---- 生命线数据（24h，5min/桶；模拟一天：夜段睡眠、两次高峰、少许错误） ----
  const cols = 288;
  function dayPattern(i) { // 0..1 强度
    const h = i / 12; // 24h
    if (h < 0.5) return 0.12;                 // 前夜将睡
    if (h < 7) return 0;                       // 睡眠 00:30-07:00
    if (h < 7.5) return 0.25;                  // 醒
    if (h < 9) return 0.45;                    // 早晨思考
    if (h < 10.4) return 0.18;
    if (h < 10.6) return 0.95;                 // 高峰（评审轮）
    if (h < 12) return 0.5;
    if (h < 14) return 0.2;
    if (h < 16.5) return 0.65;                 // 下午高峰
    if (h < 18) return 0.3;
    if (h < 21) return 0.5;
    if (h < 22.5) return 0.22;
    return 0.1;
  }
  const active = [], tiny = [], tinier = [];
  for (let i = 0; i < cols; i++) {
    const base = dayPattern(i);
    const v = base * (0.6 + 0.4 * Math.sin(i * 1.7) * Math.cos(i * 0.83));
    active.push(Math.max(0, v));
    tiny.push(dayPattern((i + 70) % cols) * (0.5 + 0.3 * Math.sin(i)));
    tinier.push(dayPattern((i + 180) % cols) * 0.3);
  }
  const errs = [123, 128, 210, 246];      // 桶索引
  const msgs = [58, 126, 127, 130, 200, 214, 247, 252, 269, 281];
  // 工作台年轮：近 14 天（每天一柱；0=无运行）
  const days14ada = [0, .55, .35, .7, .45, 0, .85, .6, .3, .9, .5, .35, .8, .6];
  const days14q1  = [0, 0, .2, 0, 0, 0, .15, 0, 0, .1, 0, 0, .12, 0];
  const days14q2  = [0, 0, 0, .1, 0, 0, 0, 0, .08, 0, 0, 0, 0, 0];

  function buildVital() {
    const track = document.getElementById('vital-track'); if (!track) return;
    const bars = track.querySelector('.vbars'); bars.replaceChildren();
    active.forEach((v, i) => {
      const b = document.createElement('i'); b.className = 'vb';
      b.style.height = Math.round(v * 30) + 'px';
      if (v < 0.15) b.classList.add('dim');
      bars.appendChild(b);
    });
    errs.forEach(i => { const m = document.createElement('i'); m.className = 'vm err'; m.style.left = (i / cols * 100) + '%'; track.appendChild(m); });
    msgs.forEach(i => { const m = document.createElement('i'); m.className = 'vm msg'; m.style.left = (i / cols * 100) + '%'; track.appendChild(m); });
    // 悬停读数
    const tip = document.getElementById('tip');
    track.onmousemove = (e) => {
      const r = track.getBoundingClientRect();
      const idx = Math.min(cols - 1, Math.max(0, Math.round((e.clientX - r.left) / r.width * cols)));
      const h = Math.floor(idx / 12), m = (idx % 12) * 5;
      const steps = Math.round(active[idx] * 46);
      const err = errs.some(x => Math.abs(x - idx) < 3);
      const msg = msgs.some(x => Math.abs(x - idx) < 3);
      tip.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} · ${steps ? steps + ' 步' : '睡眠'}${err ? ' · 错误' : ''}${msg ? ' · 消息' : ''}`;
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 30) + 'px';
    };
    track.onmouseleave = () => { tip.style.display = 'none'; };
  }
  function buildSpark(id, data, errBuckets) {
    const el = document.getElementById(id); if (!el) return;
    const groups = Math.min(24, data.length), stride = Math.ceil(data.length / groups), agg = [];
    for (let g = 0; g < groups; g++) {
      let s = 0; for (let k = 0; k < stride; k++) s += data[g * stride + k] || 0;
      agg.push(s / stride);
    }
    const errSet = new Set((errBuckets || []).map(b => Math.floor(b / stride)));
    agg.forEach((v, gi) => {
      const i = document.createElement('i'); i.style.height = Math.max(1, Math.round(v * 32)) + 'px';
      if (v < 0.08) i.className = 'g'; else if (errSet.has(gi)) i.className = 'e';
      el.appendChild(i);
    });
  }
  // ---- 用量柱图 ----
  const days = [
    [0.30,0.10,0.06],[0,0,0],[0.45,0.16,0.10],[0.08,0.02,0.02],[0,0,0],[0.55,0.20,0.12],[0.22,0.07,0.05],[0,0,0],[0.40,0.15,0.09],[0.62,0.24,0.14],[0.12,0.04,0.03],[0.95,0.36,0.22],[0.58,0.20,0.12],[0.20,0.06,0.04],
  ];
  function buildBars() {
    const el = document.getElementById('tokbars'); if (!el) return; el.replaceChildren();
    days.forEach(([a, b, c]) => {
      const col = document.createElement('div'); col.className = 'bcol';
      const mk = (v, cls) => { const d = document.createElement('i'); d.className = cls; d.style.height = Math.round(v * 100) + 'px'; return d; };
      col.appendChild(mk(c, 'seg-th')); col.appendChild(mk(b, 'seg-out')); col.appendChild(mk(a, 'seg-in'));
      el.appendChild(col);
    });
  }
  show('traj');
</script>
</body>
