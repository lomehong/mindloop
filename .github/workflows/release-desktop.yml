# 桌面安装包流水线：与 release.yml 同 tag 触发，产出 Tauri NSIS
# 安装包并追加到 GoReleaser 已创建的 GitHub Release。失败不影响
# Go 二进制发布（两个 job 相互独立）。
name: release-desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/static/package-lock.json
      - name: 构建前端
        working-directory: web/static
        run: |
          npm ci
          npm run build
      - name: 构建 sidecar（嵌入前端）
        run: >
          go build -tags release -o
          desktop/src-tauri/binaries/mindloop-x86_64-pc-windows-msvc.exe
          ./cmd/mindloop
      - name: 同步 viewer 资源（bundle.resources 需要）
        run: Copy-Item -Recurse -Force web/static/build/client desktop/src-tauri/viewer-static
      - name: Tauri 打包（NSIS）
        working-directory: desktop
        run: npx @tauri-apps/cli@2 build
      - name: 上传安装包到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release upload $tag "desktop/src-tauri/target/release/bundle/nsis/*.exe" --clobber
