# 质量门禁：gofmt + vet + 测试全绿才允许合并。viewer 前端同样
# 上锁——typecheck + vitest + 生产构建（2026-09 起，此前套件红了
# 没人拦）。gofmt 门禁依赖 .gitattributes 的 LF 策略，保证 Windows
# checkout 与 Linux 一致。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        # Windows 是一等公民（Job Object 沙箱只有 Windows 能测到），
        # ubuntu 保证跨平台可编译可运行，并承担 -race 数据竞争检测。
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt（有输出即失败）
        # windows runner 的 run 默认是 pwsh，这里需要 POSIX 的
        # test -z "$(...)" 写法，显式钉 bash。
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: go test（ubuntu 加 -race 检测数据竞争）
        # 失败现场写进 ::error:: 注解 + Step Summary + 工件——三者
        # 匿名可读（API 日志要 admin），CI 红时本地复现不用猜。
        shell: bash
        run: |
          set -o pipefail
          go test ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }} ./... 2>&1 | tee go-test.log
          status=$?
          {
            echo "### go test 退出码 $status"
            grep -E "^--- FAIL|^FAIL|^panic:|fatal error:" go-test.log | head -40
            echo '```'
            tail -60 go-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^--- FAIL|^FAIL|^panic:" go-test.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          exit $status
      - name: 上传 go test 日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-log-${{ matrix.os }}
          path: go-test.log
          retention-days: 14

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/static/package-lock.json
      # npm ci 严格按 package-lock.json 安装，lock 漂移直接失败。
      - run: npm ci --no-audit --no-fund
      - run: npx react-router typegen && npx tsc --noEmit
      - run: npm test
      # 生产构建（react-router build）进门禁：bundling 断裂、
      # 重依赖解析问题不能等本机构建才暴露。
      - run: npm run build
