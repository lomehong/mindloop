[package]
name = "mindloop-desktop"
version = "0.1.0"
description = "mindloop 桌面壳"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2" }
dunce = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Graphics_Dwm",
  "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
